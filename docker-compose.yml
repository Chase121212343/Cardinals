x-common:
  database:
    &db-environment
    MYSQL_PASSWORD: &db-password "cardinals_db_pass"
    MYSQL_ROOT_PASSWORD: "cardinals_root_pass"
  panel:
    &panel-environment
    APP_NAME: "Cardinals"
    APP_URL: "http://localhost"
    APP_TIMEZONE: "UTC"
    APP_SERVICE_AUTHOR: "noreply@cardinals.local"
  mail:
    &mail-environment
    MAIL_FROM: "noreply@cardinals.local"
    MAIL_DRIVER: "log"
    MAIL_HOST: "localhost"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "false"

services:
  database:
    image: mariadb:11
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - cardinals_db:/var/lib/mysql
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:alpine
    restart: unless-stopped

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    ports:
      - "80:80"
    links:
      - database
      - cache
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - cardinals_var:/app/var/
      - cardinals_nginx:/etc/nginx/http.d/
      - cardinals_certs:/etc/letsencrypt/
      - cardinals_logs:/app/storage/logs
      - ./panel/resources/views:/app/resources/views:ro
      - ./panel/resources/lang:/app/resources/lang:ro
      - ./panel/public/assets/svgs:/app/public/assets/svgs:ro
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
      HASHIDS_LENGTH: 8

volumes:
  cardinals_db:
  cardinals_var:
  cardinals_nginx:
  cardinals_certs:
  cardinals_logs:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
